[project]
name = "corigami-repro"
version = "0.1.0"
description = "Small-scale reproduction of COrigami (arXiv:2606.26299) — flat-foldable box-pleated origami design pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corigami"]

[tool.pytest.ini_options]
testpaths = ["tests"]
